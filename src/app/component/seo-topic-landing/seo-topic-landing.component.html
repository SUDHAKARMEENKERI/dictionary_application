<div class="container my-4 cpb-seo-topic">
  <div class="hero">
    <h1>{{ topic }} Interview Questions and Answers</h1>
    <p class="text-muted mb-0">
      Practice {{ topic }} interview questions with clear, interview-ready answers.
      Open the topic page to start.
    </p>
  </div>

  <div class="mt-4">
    <a class="btn btn-primary" [routerLink]="['/tutorial', category, topic]">
      View {{ topic }} Questions
    </a>

    <div class="mt-3 small text-muted">
      Tip: Inside the topic page, use the search box to quickly find a question.
    </div>
  </div>
</div>

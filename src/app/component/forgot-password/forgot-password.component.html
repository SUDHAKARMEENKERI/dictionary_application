<div class="cpb-auth py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm cpb-auth-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="cpb-auth-icon mb-2">
                                <i class="bi bi-shield-lock"></i>
                            </div>
                            <h1 class="h4 mb-1">Reset your password</h1>
                            <div class="text-muted small">Enter your email and choose a new password</div>
                        </div>

                        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
                            <div class="mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input formControlName="mobile" type="tel" autocomplete="tel" class="form-control" />
                                <div class="text-danger small mt-1" *ngIf="forgotForm.get('mobile')?.invalid && forgotForm.get('mobile')?.touched">
                                    Enter a valid mobile number.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <div class="input-group">
                                    <input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" class="form-control" />
                                    <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                                        <span *ngIf="!showPassword" class="bi bi-eye"></span>
                                        <span *ngIf="showPassword" class="bi bi-eye-slash"></span>
                                    </button>
                                </div>
                                <div class="text-danger small mt-1" *ngIf="forgotForm.get('password')?.invalid && forgotForm.get('password')?.touched">
                                    Password must be at least 6 characters.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" class="form-control" />
                                    <button type="button" class="btn btn-outline-secondary" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'">
                                        <span *ngIf="!showConfirmPassword" class="bi bi-eye"></span>
                                        <span *ngIf="showConfirmPassword" class="bi bi-eye-slash"></span>
                                    </button>
                                </div>
                                <div class="text-danger small mt-1" *ngIf="forgotForm.errors?.['mismatch'] && forgotForm.get('confirmPassword')?.touched">
                                    Passwords do not match.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" [disabled]="forgotForm.invalid || isLoading">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                {{ isLoading ? 'Updating Password...' : 'Reset Password' }}
                            </button>

                            <div class="text-center small mt-3">
                                <a routerLink="/login">Back to login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [openModalDetails]="openModalDetails"></app-modal>

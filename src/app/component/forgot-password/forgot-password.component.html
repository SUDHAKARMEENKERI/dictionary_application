<div class="container mt-4">
    <h4>Reset Password</h4>
</div>
<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="p-4 border rounded bg-light">
    <div class="mb-3">
        <label>Email:</label>
        <input formControlName="email" type="email" class="form-control" />
        <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
            Enter a valid email.
        </div>
    </div>

    <div class="mb-3">
        <label>Password:</label>
        <div class="input-group">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control" />
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword"
                tabindex="-1">
                <span *ngIf="!showPassword" class="bi bi-eye"></span>
                <span *ngIf="showPassword" class="bi bi-eye-slash"></span>
            </button>
        </div>
        <div *ngIf="forgotForm.get('password')?.invalid && forgotForm.get('password')?.touched">
            Password must be at least 6 characters.
        </div>
    </div>

    <div class="mb-3">
        <label>Confirm Password:</label>
        <div class="input-group">
            <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
                class="form-control" />
            <button type="button" class="btn btn-outline-secondary" (click)="showConfirmPassword = !showConfirmPassword"
                tabindex="-1">
                <span *ngIf="!showConfirmPassword" class="bi bi-eye"></span>
                <span *ngIf="showConfirmPassword" class="bi bi-eye-slash"></span>
            </button>
        </div>
        <div *ngIf="forgotForm.errors?.['mismatch'] && forgotForm.get('confirmPassword')?.touched">
            Passwords do not match.
        </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="forgotForm.invalid">Reset Password</button>
</form>

<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="p-4 border rounded bg-light">
    <div class="mb-3">
        <label>Email:</label>
        <input formControlName="email" type="email" class="form-control" />
        <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
            Enter a valid email.
        </div>
    </div>

    <div class="mb-3">
        <label>Password:</label>
        <input formControlName="password" type="password" class="form-control" />
        <div *ngIf="forgotForm.get('password')?.invalid && forgotForm.get('password')?.touched">
            Password must be at least 6 characters.
        </div>
    </div>

    <div class="mb-3">
        <label>Confirm Password:</label>
        <input formControlName="confirmPassword" class="form-control" type="password" />
        <div *ngIf="forgotForm.errors?.['mismatch'] && forgotForm.get('confirmPassword')?.touched">
            Passwords do not match.
        </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="forgotForm.invalid">Reset Password</button>
</form>

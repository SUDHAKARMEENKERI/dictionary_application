<!-- user-form.component.html -->

<div class="container-fluid words-container mt-4">
    <!-- Header Section -->
    <div class="header-section mb-5">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h2 class="page-title mb-1">
                    <i class="bi bi-book-fill me-2"></i>Add A New Word
                </h2>
                <p class="text-muted">Manage and organize your vocabulary</p>
            </div>
        </div>
    </div>

    <div class="action-buttons-section mb-4">
        <div class="row g-2">
            <div class="col-12 col-sm-6 col-md-3">
                <button (click)="showWordList()" class="btn btn-primary w-100">
                    <i class="bi bi-plus-circle me-2"></i>Show Word List
                </button>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <button (click)="showAllUserWordList()" class="btn btn-info w-100 text-white">
                    <i class="bi bi-eye me-2"></i>Show All Word
                </button>
            </div>
        </div>
    </div>

    <form [formGroup]="addWordForm" (ngSubmit)="onSubmit()" class="p-4 border rounded bg-light">
        <div class="mb-3">
            <label for="name" class="form-label">Word</label>
            <input id="name" type="text" class="form-control" formControlName="word" />
            <div *ngIf="addWordForm.get('word')?.invalid && addWordForm.get('word')?.touched" class="text-danger">
                Word is required.
            </div>
        </div>

        <div class="mb-3">
            <label for="meaning" class="form-label">Meaning</label>
            <textarea id="meaning" class="form-control" formControlName="meaning"></textarea>
            <div *ngIf="addWordForm.get('meaning')?.invalid && addWordForm.get('meaning')?.touched" class="text-danger">
                Meaning is required.
            </div>
        </div>
        <div class="mb-3">
            <radio-group class="mb-3">
                <label class="form-label me-3">Show word to other users:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" formControlName="show_for_others" [value]="true"
                        id="showYes">
                    <label class="form-check-label" for="showYes">Yes</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" formControlName="show_for_others" [value]="false"
                        id="showNo">
                    <label class="form-check-label" for="showNo">No</label>
                </div>
            </radio-group>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="addWordForm.invalid">Submit</button>
    </form>

    <div class="mt-4" *ngIf="isOwner">
        <div class="row action-buttons-section mt-4 mb-4">
            <div class="col-9 col-sm-9 col-md-9">
                <h3 class="page-title mb-1">User List</h3>
            </div>
            <div class="col-3 col-sm-3 col-md-3">
                <button (click)="exportToExcel()" class="btn btn-success w-100">
                    <i class="bi bi-download me-2"></i>Export to Excel
                </button>
            </div>

        </div>

        <!-- <table class="table table-bordered table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>Name</th>
                    <th>Mobile Number</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of userList">
                    <td>{{ user.firstName + ' ' + user.lastName }}</td>
                    <td>{{ user.mobile }}</td>
                    <td>{{ user.email }}</td>
                </tr>
            </tbody>
        </table> -->

        <div class="table-responsive mt-4">
            <table class="table custom-table align-middle">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Mobile</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of userList">
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar">
                                    {{ user.firstName[0] }}{{ user.lastName[0] }}
                                </div>
                                <div class="ms-3">
                                    <div class="fw-semibold">
                                        {{ user.firstName }} {{ user.lastName }}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark">
                                {{ user.mobile }}
                            </span>
                        </td>
                        <td>
                            <a href="mailto:{{ user.email }}" class="email-link">
                                {{ user.email }}
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
<app-modal [openModalDetails]="openModalDetails"></app-modal>

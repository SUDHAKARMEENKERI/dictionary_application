<div class="cpb-form-page py-4 py-md-5 bg-light">
    <div class="container">
        <div class="card shadow-sm cpb-form-card">
            <div class="card-body p-4 p-md-5">
                
                <div class="mb-3">
                    <a routerLink="/dashboard" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
                    </a>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                    <div>
                        <h1 class="h4 mb-1">
                            <i class="bi bi-journal-plus me-2"></i>
                            {{ editMode.isEditMode ? 'Edit Question and Answer' : 'Add Question and Answer' }}
                        </h1>
                        <div class="text-muted small">Create interview Q&A, MCQs, and output-based questions</div>
                    </div>

                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <select class="form-select form-select-sm" style="width: 260px;" [(ngModel)]="bulkTemplateType"
                            [ngModelOptions]="{ standalone: true }">
                            <option value="THEORY">Bulk Type: Theory</option>
                            <option value="MCQ">Bulk Type: MCQ</option>
                            <option value="OUTPUTBASEDMCQ">Bulk Type: Output Based MCQ</option>
                            <option value="OUTPUTBASED">Bulk Type: Output Based (Answer Type)</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm" type="button" (click)="downloadBulkTemplate()">
                            <i class="bi bi-download me-1"></i>
                            Download Template
                        </button>
                        <label class="btn btn-outline-secondary btn-sm mb-0">
                            <i class="bi bi-file-earmark-excel me-1"></i>
                            Choose Excel
                            <input type="file" accept=".xlsx" (change)="onFileSelect($event)" hidden />
                        </label>
                        <button class="btn btn-primary btn-sm" (click)="upload()" [disabled]="!excelFile || isBulkUploading">
                            <i class="bi bi-cloud-arrow-up me-1"></i>
                            {{ isBulkUploading ? 'Uploading...' : 'Bulk Upload' }}
                        </button>
                    </div>
                </div>

                <form [formGroup]="questionAnswerForm" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label class="form-label">Question</label>
                        <input formControlName="question" type="text" class="form-control"
                            placeholder="Type your question" />
                        <div class="text-danger small mt-1"
                            *ngIf="questionAnswerForm.get('question')?.invalid && questionAnswerForm.get('question')?.touched">
                            Question is required.
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select formControlName="category" id="category" class="form-select">
                                <option value="">Select a Category</option>
                                <option *ngFor="let opt of categoryTopic" [value]="opt.id">{{ opt.name }}</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="topic" class="form-label">Topic</label>
                            <select formControlName="topic" id="topic" class="form-select">
                                <option value="">Select a topic</option>
                                <option *ngFor="let opt of topicItem" [value]="opt.name">{{ opt.name }}</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="questionType" class="form-label">Question Type</label>
                            <select formControlName="questionType" id="questionType" class="form-select">
                                <option value="">Select a Question Type</option>
                                <option *ngFor="let opt of questionType" [value]="opt.value">{{ opt.label }}</option>
                            </select>
                        </div>

                        <div class="mb-3" *ngIf="isOutputBasedQuestion">
                            <label class="form-label">Code</label>
                            <textarea formControlName="code" class="form-control" rows="6"
                                placeholder="Paste code here"></textarea>
                            <div class="text-danger small mt-1"
                                *ngIf="questionAnswerForm.get('code')?.invalid && questionAnswerForm.get('code')?.touched">
                                Code is required for output-based questions.
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="level" class="form-label">Level</label>
                            <select formControlName="level" id="level" class="form-select">
                                <option *ngFor="let opt of difficultyLevels" [value]="opt.value">{{ opt.label }}
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-3" *ngIf="isNonTheoryQuestion">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label">Option A</label>
                                <input formControlName="optionA" type="text" class="form-control" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Option B</label>
                                <input formControlName="optionB" type="text" class="form-control" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Option C</label>
                                <input formControlName="optionC" type="text" class="form-control" />
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Option D</label>
                                <input formControlName="optionD" type="text" class="form-control" />
                            </div>
                            <div class="col-12">
                                <label class="form-label">Correct Answer</label>
                                <input formControlName="correctAnswer" type="text" class="form-control"
                                    placeholder="Example: A" />
                            </div>
                        </div>
                    </div>

                    <div class="mt-3" *ngIf="!isNonTheoryQuestion">
                        <label class="form-label">Answer</label>
                        <textarea formControlName="answer" class="form-control" rows="6"
                            placeholder="Write the answer"></textarea>
                    </div>

                    <div class="mt-3">
                        <label for="image" class="form-label">Upload Image (Optional)</label>
                        <input type="file" id="image" (change)="onFileChange($event)" accept="image/*"
                            class="form-control" />
                        <div *ngIf="imageSrc" class="mt-2 d-flex flex-wrap align-items-center gap-2">
                            <img [src]="imageSrc" alt="Preview" class="img-thumbnail" style="max-width: 320px;">
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                (click)="removeImage()">Remove</button>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" [disabled]="questionAnswerForm.invalid">
                            {{ editMode.isEditMode ? 'Save Changes' : 'Submit' }}
                        </button>
                        <button type="button" class="btn btn-outline-secondary"
                            (click)="questionAnswerForm.reset(); removeImage();">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<app-modal [openModalDetails]="openModalDetails"></app-modal>

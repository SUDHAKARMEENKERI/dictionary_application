<div class="cpb-help py-5 bg-light">
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
          <div>
            <h1 class="h3 mb-1">Help Center</h1>
            <div class="text-muted small">Quick answers to common questions</div>
          </div>
          <a class="btn btn-outline-primary btn-sm" routerLink="/contact">Contact Us</a>
        </div>

        <div class="row g-3">
          <div class="col-12 col-lg-6" *ngFor="let item of faqs; trackBy: trackByIndex">
            <div class="faq-card">
              <div class="q">{{ item.q }}</div>
              <div class="a text-muted">{{ item.a }}</div>
            </div>
          </div>
        </div>

        <hr class="my-4" />
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-primary" routerLink="/dashboard">Back to Dashboard</a>
          <a class="btn btn-outline-secondary" routerLink="/interview-prep">Interview Prep</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container my-4">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="page-title mb-0">
                <i class="bi bi-chat-left-quote me-2"></i>Question & Answers
            </h2>
            <p class="text-muted">Browse and manage all Q&A content</p>
        </div>
    </div>

    <!-- No Data Message -->
    <div class="alert alert-info alert-dismissible fade show" role="alert" *ngIf="questionAnswers.length === 0">
        <i class="bi bi-info-circle me-2"></i>
        <strong>No Questions Found</strong> - Start by adding your first question and answer.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Questions Container -->
    <div class="questions-grid">
        <div class="qa-card" *ngFor="let qa of questionAnswers">
            <!-- Card Header -->
            <div class="qa-card-header">
                <div class="qa-content">
                    <div class="question-section">
                        <span class="qa-badge question-badge">
                            <i class="bi bi-question-circle-fill"></i>
                        </span>
                        <div class="qa-text">
                            <h5 class="question-title">{{ qa.question }}</h5>
                        </div>
                    </div>

                    <div class="answer-section">
                        <span class="qa-badge answer-badge">
                            <i class="bi bi-check-circle-fill"></i>
                        </span>
                        <div class="qa-text">
                            <p class="answer-content">{{ qa.answer }}</p>
                        </div>
                    </div>

                    <!-- Topic Badge -->
                    <div class="topic-section" *ngIf="qa.topic">
                        <span class="badge bg-light text-dark">
                            <i class="bi bi-tag me-1"></i>{{ qa.topic }}
                        </span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="qa-actions">
                    <button class="btn btn-sm btn-outline-primary" title="Edit Question" (click)="onEdit(qa)">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-outline-danger" title="Delete Question" (click)="onDelete(qa)">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>

            <!-- Image Section -->
            <div class="qa-image-section" *ngIf="qa.image || qa.imageBase64">
                <img *ngIf="qa.image" [src]="getImageSrc(qa.image)" alt="Question Image" class="qa-image" />
                <img *ngIf="qa.imageBase64" [src]="getImageSrc(qa.imageBase64)" alt="Question Image" class="qa-image" />
            </div>
        </div>
    </div>

    <!-- Pagination Section -->
    <div class="pagination-section" *ngIf="totalPages > 1">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" [class.disabled]="currentPage === 0">
                    <button class="page-link" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">
                        <i class="bi bi-chevron-left me-1"></i>Previous
                    </button>
                </li>

                <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
                    [class.active]="i === currentPage">
                    <button class="page-link" (click)="goToPage(i)">{{ i + 1 }}</button>
                </li>

                <li class="page-item" [class.disabled]="currentPage === totalPages - 1">
                    <button class="page-link" (click)="goToPage(currentPage + 1)"
                        [disabled]="currentPage === totalPages - 1">
                        Next<i class="bi bi-chevron-right ms-1"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </div>

</div>

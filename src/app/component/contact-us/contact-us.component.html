<div class="contact-root py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="mb-4 message-alert" *ngIf="messageShow">
                     <h3 class="mb-0"><i class="bi bi-check-circle-fill me-2"></i>{{ messageShow }}</h3>
                </div>
                <div class="card shadow-sm overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-5 bg-primary text-white p-4 info-panel">
                            <h3 class="mb-3">Get in Touch</h3>
                            <p class="small">Have questions or feedback? Send us a message and we'll respond promptly.</p>

                            <ul class="list-unstyled contact-list mt-4">
                                <li><i class="bi bi-envelope-fill me-2 icon"></i><strong>Email:</strong> contact&#64;careerprepook.com</li>
                                <li><i class="bi bi-telephone-fill me-2 icon"></i><strong>Phone:</strong> 9611657325</li>
                                <li><i class="bi bi-geo-alt-fill me-2 icon"></i><strong>Address:</strong> 2nd Main Road Shivanagar, Rajajinagar Bengaluru -560010</li>
                            </ul>

                            <div class="social mt-4">
                                <a class="btn btn-outline-light btn-sm me-2" href="#" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
                                <a class="btn btn-outline-light btn-sm me-2" href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                                <a class="btn btn-outline-light btn-sm" href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                            </div>
                        </div>

                        <div class="col-md-7 p-4">
                            <h4 class="mb-3">Contact Us</h4>
                            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Your name">
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" id="email" formControlName="email" placeholder="you@example.com">
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <div class="input-group">
                                        <span class="input-group-text align-self-start pt-2"><i class="bi bi-chat-left-text"></i></span>
                                        <textarea class="form-control" id="message" rows="6" formControlName="message" placeholder="Write your message here"></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted">We normally reply within 1-2 business days.</small>
                                    <button type="submit" class="btn btn-primary btn-gradient">Send Message <i class="bi bi-send ms-2"></i></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

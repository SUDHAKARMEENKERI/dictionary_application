<footer class="cpb-footer">
	<div class="container py-4">
		<div class="row gy-4">
			<div class="col-lg-4">
				<div class="brand">CareerPrepBook</div>
				<p class="tagline">
					Practice vocabulary, interview Q&A, quizzes, and programming problems — all in one place.
				</p>
			</div>

			<div class="col-6 col-lg-3">
				<div class="title">Quick Links</div>
				<ul class="links">
					<li *ngFor="let l of quickLinks; trackBy: trackByPath">
						<a [routerLink]="l.path">{{ l.label }}</a>
					</li>
				</ul>
			</div>

			<div class="col-6 col-lg-3">
				<div class="title">Practice</div>
				<ul class="links">
					<li *ngFor="let l of practiceLinks; trackBy: trackByPath">
						<a [routerLink]="l.path">{{ l.label }}</a>
					</li>
				</ul>
			</div>

			<div class="col-12 col-lg-2">
				<div class="title">Company</div>
				<ul class="links">
					<li *ngFor="let l of companyLinks; trackBy: trackByPath">
						<a [routerLink]="l.path">{{ l.label }}</a>
					</li>
				</ul>
			</div>
		</div>

		<div class="bottom mt-4 pt-3">
			<div class="muted">© {{ year }} CareerPrepBook. All rights reserved.</div>
		</div>
	</div>
</footer>
